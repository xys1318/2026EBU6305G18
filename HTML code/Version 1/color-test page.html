<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Encoding Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f7fa;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }
    /* 双击返回首页按钮（所有非首页显示） */
    .back-home-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 16px;
      background: #6c757d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: bold;
    }
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }
    .home-btns {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 60px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #409eff;
      color: white;
      cursor: pointer;
    }
    button.secondary {
      background: #6c757d;
    }
    button.danger {
      background: #f56c6c;
    }
    .setting-group {
      margin: 30px 0;
      text-align: center;
    }
    .setting-group h3 {
      margin-bottom: 15px;
    }
    .options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btns {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .question-box {
      padding: 20px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin: 20px 0;
      min-height: 220px;
      line-height: 1.6;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      min-width: 320px;
    }
    .modal-btns {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .highlight {
      border: 2px solid #f56c6c !important;
      padding: 10px;
      border-radius: 8px;
    }
    .review-item {
      border: 1px solid #eee;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .review-body {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #eee;
      display: none;
    }
    .review-body.show {
      display: block;
    }
    .q-item {
      padding: 8px 0;
      cursor: pointer;
    }
    .correct {
      color: #67c23a;
    }
    .wrong {
      color: #f56c6c;
    }
    .score {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin: 30px 0;
    }
    .wrong-list {
      margin: 20px 0;
      text-align: center;
    }
    .wrong-num {
      display: inline-block;
      padding: 8px 12px;
      background: #f56c6c;
      color: white;
      border-radius: 4px;
      margin: 5px;
      cursor: pointer;
    }
    .option-label {
      display: block;
      margin: 8px 0;
      cursor: pointer;
    }
    .fill-input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 双击返回首页按钮 -->
    <button class="back-home-btn" id="backHomeBtn" ondblclick="goHome()">Back to Home (Double Click)</button>

    <div class="header">Color Encoding Test</div>

    <!-- 首页 -->
    <div id="home" class="view active">
      <div class="home-btns">
        <button onclick="showView('setting')">Start Test</button>
        <button class="secondary" onclick="showView('review')">Test Review</button>
      </div>
    </div>

    <!-- 测试设置 -->
    <div id="setting" class="view">
      <div class="setting-group" id="diff-group">
        <h3>Difficulty</h3>
        <div class="options">
          <label class="option-item"><input type="radio" name="diff" value="easy"> Easy</label>
          <label class="option-item"><input type="radio" name="diff" value="medium"> Medium</label>
          <label class="option-item"><input type="radio" name="diff" value="hard"> Hard</label>
        </div>
      </div>

      <div class="setting-group" id="type-group">
        <h3>Question Type</h3>
        <div class="options">
          <label class="option-item"><input type="checkbox" name="type" value="mcq"> MCQ</label>
          <label class="option-item"><input type="checkbox" name="type" value="tf"> True/False</label>
          <label class="option-item"><input type="checkbox" name="type" value="fill"> Fill in the Blanks</label>
        </div>
      </div>

      <div class="btns">
        <button onclick="confirmSetting()">Confirm</button>
        <button class="secondary" onclick="backFromSetting()">Back</button>
      </div>
    </div>

    <!-- 答题界面 -->
    <div id="quiz" class="view">
      <div id="question-container" class="question-box"></div>
      <div class="nav-bar">
        <button id="prev-btn" onclick="prevQuestion()">Previous</button>
        <div id="q-index">Question 1/10</div>
        <button id="next-btn" onclick="nextQuestion()">Next</button>
        <button id="submit-btn" class="danger" onclick="submitPaper()" style="display:none;">Submit</button>
      </div>
    </div>

    <!-- 成绩界面 -->
    <div id="score" class="view">
      <div class="score" id="final-score"></div>
      <div class="wrong-list" id="wrong-list"></div>
      <div class="btns">
        <button onclick="goHome()">Back to Home</button>
      </div>
    </div>

    <!-- 测试回顾 -->
    <div id="review" class="view">
      <div id="review-list"></div>
      <div class="btns">
        <button class="secondary" onclick="goHome()">Back</button>
      </div>
    </div>

    <!-- 解析弹窗 -->
    <div class="modal" id="analysis-modal">
      <div class="modal-content">
        <div id="analysis-content"></div>
        <div class="modal-btns">
          <button onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>

    <!-- 通用弹窗 -->
    <div class="modal" id="modal">
      <div class="modal-content" id="modal-text"></div>
    </div>
  </div>

  <script>
    // ==============================================
    // 初始化：关闭重开网站 → 清空进度，仅保留测试回顾
    // ==============================================
    const testRecords = JSON.parse(localStorage.getItem('testRecords')) || [];
    let state = {
      currentView: 'home',
      currentQ: 0,
      questions: []
    };
    localStorage.setItem('testState', JSON.stringify(state));

    // ===================== 完整题库（每类30题） =====================
    const questionBank = {
      mcq: [
        { id:1, title:"Which color model is used for digital screens?", options:["A.RGB","B.CMYK","C.HSV","D.Pantone"], answer:"A", analysis:"RGB is for screens." },
        { id:2, title:"Which color model is used for printing?", options:["A.RGB","B.CMYK","C.HSL","D.HSV"], answer:"B", analysis:"CMYK is for printing." },
        { id:3, title:"What does 'R' in RGB mean?", options:["A.Red","B.Rate","C.Random","D.Render"], answer:"A", analysis:"RGB = Red Green Blue." },
        { id:4, title:"Standard web color space?", options:["A.sRGB","B.Adobe RGB","C.CMYK","D.ROMM"], answer:"A", analysis:"sRGB is web standard." },
        { id:5, title:"8-bit color range?", options:["A.0-255","B.0-100","C.1-100","D.1-256"], answer:"A", analysis:"8-bit = 0~255." },
        { id:6, title:"What does 'C' in CMYK mean?", options:["A.Cyan","B.Color","C.Clear","D.Cool"], answer:"A", analysis:"C=Cyan in CMYK." },
        { id:7, title:"RGB(255,255,255) is?", options:["A.White","B.Black","C.Red","D.Blue"], answer:"A", analysis:"Full light = white." },
        { id:8, title:"RGB(0,0,0) is?", options:["A.Black","B.White","C.Green","D.Yellow"], answer:"A", analysis:"No light = black." },
        { id:9, title:"Hex for pure red?", options:["A.#FF0000","B.#00FF00","C.#0000FF","D.#FFFF00"], answer:"A", analysis:"#FF0000 = red." },
        { id:10, title:"Hex for pure blue?", options:["A.#0000FF","B.#FF0000","C.#00FF00","D.#000000"], answer:"A", analysis:"#0000FF = blue." },
        { id:11, title:"Additive color model?", options:["A.RGB","B.CMYK","C.Pantone","D.RAL"], answer:"A", analysis:"RGB is additive." },
        { id:12, title:"Subtractive color model?", options:["A.CMYK","B.RGB","C.HSV","D.HSL"], answer:"A", analysis:"CMYK is subtractive." },
        { id:13, title:"HSV means?", options:["A.Hue Saturation Value","B.Hue Saturation Lightness","C.Height Saturation Value","D.Hue Sharp Value"], answer:"A", analysis:"HSV = Hue Saturation Value." },
        { id:14, title:"HSL means?", options:["A.Hue Saturation Lightness","B.Hue Saturation Value","C.Height Sharp Lightness","D.Hue Saturation Level"], answer:"A", analysis:"HSL = Hue Saturation Lightness." },
        { id:15, title:"RGB primaries count?", options:["A.3","B.4","C.6","D.8"], answer:"A", analysis:"3 primaries: R, G, B." },
        { id:16, title:"8-bit RGB colors?", options:["A.16.7 million","B.256","C.65536","D.1024"], answer:"A", analysis:"256^3 = 16.7 million." },
        { id:17, title:"Uses RGB?", options:["A.Monitor","B.Printer","C.Scanner","D.Camera"], answer:"A", analysis:"Monitor uses RGB." },
        { id:18, title:"Uses CMYK?", options:["A.Printer","B.Monitor","C.Tablet","D.Phone"], answer:"A", analysis:"Printer uses CMYK." },
        { id:19, title:"RGB full name?", options:["A.Red Green Blue","B.Red Gray Black","C.Rate Gamma Bright","D.Red Gradient Bright"], answer:"A", analysis:"Red Green Blue." },
        { id:20, title:"CMYK key color?", options:["A.Black","B.White","C.Cyan","D.Magenta"], answer:"A", analysis:"K = Black." },
        { id:21, title:"Web design uses?", options:["A.RGB","B.CMYK","C.Pantone","D.LAB"], answer:"A", analysis:"Web uses RGB." },
        { id:22, title:"Wider gamut?", options:["A.RGB","B.CMYK","C.Same","D.Depends"], answer:"A", analysis:"RGB gamut is wider." },
        { id:23, title:"Hex for green?", options:["A.#00FF00","B.#FF0000","C.#0000FF","D.#FFFF00"], answer:"A", analysis:"#00FF00 = green." },
        { id:24, title:"Hex for yellow?", options:["A.#FFFF00","B.#FF00FF","C.#00FFFF","D.#000000"], answer:"A", analysis:"#FFFF00 = yellow." },
        { id:25, title:"Not RGB primary?", options:["A.Yellow","B.Red","C.Green","D.Blue"], answer:"A", analysis:"Yellow is secondary." },
        { id:26, title:"Color depth means?", options:["A.Number of colors","B.Brightness","C.Hue","D.Saturation"], answer:"A", analysis:"Color depth = color count." },
        { id:27, title:"Web-safe color?", options:["A.#FF0000","B.#FFGG00","C.#123XYZ","D.#ABC123X"], answer:"A", analysis:"#FF0000 is safe." },
        { id:28, title:"Hex uses base?", options:["A.16","B.10","C.2","D.8"], answer:"A", analysis:"Hex = base 16." },
        { id:29, title:"Hex length?", options:["A.6","B.3","C.8","D.12"], answer:"A", analysis:"6 characters." },
        { id:30, title:"Color selection model?", options:["A.HSV","B.CMYK","C.Pantone","D.LAB"], answer:"A", analysis:"HSV for selection." }
      ],
      tf: [
        { id:1, title:"RGB is subtractive.", answer:"False", analysis:"RGB is additive." },
        { id:2, title:"White is all colors in RGB.", answer:"True", analysis:"RGB(255,255,255) = white." },
        { id:3, title:"CMYK has more colors than RGB.", answer:"False", analysis:"RGB is wider." },
        { id:4, title:"Hex is based on RGB.", answer:"True", analysis:"Hex converts RGB." },
        { id:5, title:"HSV = Hue Saturation Value.", answer:"True", analysis:"Correct definition." },
        { id:6, title:"RGB(0,0,0) is black.", answer:"True", analysis:"No light = black." },
        { id:7, title:"CMYK is for screens.", answer:"False", analysis:"CMYK is for print." },
        { id:8, title:"sRGB is web standard.", answer:"True", analysis:"Default web space." },
        { id:9, title:"8-bit has 256 levels.", answer:"True", analysis:"0-255." },
        { id:10, title:"Green is RGB primary.", answer:"True", analysis:"R, G, B are primaries." },
        { id:11, title:"Yellow is RGB primary.", answer:"False", analysis:"Yellow is secondary." },
        { id:12, title:"#000000 is white.", answer:"False", analysis:"It is black." },
        { id:13, title:"Monitors use RGB.", answer:"True", analysis:"Correct." },
        { id:14, title:"Gamut is color range.", answer:"True", analysis:"Correct definition." },
        { id:15, title:"HSL is similar to HSV.", answer:"True", analysis:"Both are intuitive." },
        { id:16, title:"Cyan is CMYK primary.", answer:"True", analysis:"C, M, Y are primaries." },
        { id:17, title:"Magenta is RGB primary.", answer:"False", analysis:"No." },
        { id:18, title:"Higher depth = more colors.", answer:"True", analysis:"Correct." },
        { id:19, title:"Hex is case-sensitive.", answer:"False", analysis:"#fff = #FFF." },
        { id:20, title:"RGB is light-based.", answer:"True", analysis:"Correct." },
        { id:21, title:"CMYK is ink-based.", answer:"True", analysis:"Correct." },
        { id:22, title:"#FF00FF is red.", answer:"False", analysis:"It is magenta." },
        { id:23, title:"#00FFFF is cyan.", answer:"True", analysis:"Correct." },
        { id:24, title:"Saturation controls brightness.", answer:"False", analysis:"It controls purity." },
        { id:25, title:"Hue controls color type.", answer:"True", analysis:"Correct." },
        { id:26, title:"Hex starts with #.", answer:"True", analysis:"Standard format." },
        { id:27, title:"RGB has 4 primaries.", answer:"False", analysis:"Only 3." },
        { id:28, title:"Printers use RGB.", answer:"False", analysis:"They use CMYK." },
        { id:29, title:"sRGB < Adobe RGB gamut.", answer:"True", analysis:"Correct." },
        { id:30, title:"Color models standardize display.", answer:"True", analysis:"Correct." }
      ],
      fill: [
        { id:1, title:"RGB stands for Red, Green, and ____.", answer:"Blue", analysis:"Third primary is blue." },
        { id:2, title:"K in CMYK is ____.", answer:"Black", analysis:"K = Key(Black)." },
        { id:3, title:"Hex for white: ____.", answer:"#FFFFFF", analysis:"Full white." },
        { id:4, title:"Hex for black: ____.", answer:"#000000", analysis:"No light." },
        { id:5, title:"RGB is ____ (additive/subtractive).", answer:"additive", analysis:"Light addition." },
        { id:6, title:"CMYK is ____ (additive/subtractive).", answer:"subtractive", analysis:"Ink subtraction." },
        { id:7, title:"8-bit max value: ____.", answer:"255", analysis:"0-255." },
        { id:8, title:"Web standard space: ____.", answer:"sRGB", analysis:"Default web space." },
        { id:9, title:"RGB(255,0,0) is ____.", answer:"red", analysis:"Pure red." },
        { id:10, title:"RGB(0,255,0) is ____.", answer:"green", analysis:"Pure green." },
        { id:11, title:"RGB(0,0,255) is ____.", answer:"blue", analysis:"Pure blue." },
        { id:12, title:"Hex uses ____ system.", answer:"hexadecimal", analysis:"Base 16." },
        { id:13, title:"HSV: Hue, ____, Value.", answer:"Saturation", analysis:"Middle term." },
        { id:14, title:"HSL: Hue, Saturation, ____.", answer:"Lightness", analysis:"Last term." },
        { id:15, title:"____ is number of displayable colors.", answer:"Color depth", analysis:"Definition." },
        { id:16, title:"Color ____ is total displayable range.", answer:"gamut", analysis:"Definition." },
        { id:17, title:"Monitors use ____.", answer:"RGB", analysis:"Screen model." },
        { id:18, title:"Printers use ____.", answer:"CMYK", analysis:"Print model." },
        { id:19, title:"#FFFF00 is ____.", answer:"yellow", analysis:"Red+Green." },
        { id:20, title:"#00FFFF is ____.", answer:"cyan", analysis:"Green+Blue." },
        { id:21, title:"#FF00FF is ____.", answer:"magenta", analysis:"Red+Blue." },
        { id:22, title:"Hex has ____ characters.", answer:"6", analysis:"Standard length." },
        { id:23, title:"RGB primaries: R, G, ____.", answer:"blue", analysis:"Third primary." },
        { id:24, title:"Red + Green = ____.", answer:"yellow", analysis:"Color mixing." },
        { id:25, title:"Green + Blue = ____.", answer:"cyan", analysis:"Color mixing." },
        { id:26, title:"Red + Blue = ____.", answer:"magenta", analysis:"Color mixing." },
        { id:27, title:"RGB(255,255,255) = ____.", answer:"white", analysis:"Full light." },
        { id:28, title:"RGB(0,0,0) = ____.", answer:"black", analysis:"No light." },
        { id:29, title:"Saturation controls color ____.", answer:"purity", analysis:"Definition." },
        { id:30, title:"Hue controls color ____.", answer:"type", analysis:"Definition." }
      ]
    };

    // ==============================================
    // 核心功能函数
    // ==============================================
    function getRandomQuestions(type, count) {
      const pool = questionBank[type];
      let res = [];
      while (res.length < count) res.push(pool[Math.floor(Math.random() * pool.length)]);
      return res;
    }

    function generateQuestions(selectedTypes) {
      const order = ['mcq','tf','fill'];
      const valid = order.filter(t => selectedTypes.includes(t));
      state.questions = [];
      valid.forEach(t => {
        getRandomQuestions(t, 10).forEach(q => {
          if (state.questions.length >= 10) return;
          state.questions.push({
            id: state.questions.length+1, type:t, title:q.title,
            options:q.options||[], answer:q.answer, userAnswer:null,
            analysis:q.analysis, point: t==='mcq'||t==='tf'?1:3
          });
        });
      });
    }

    function saveState() {
      localStorage.setItem('testState', JSON.stringify(state));
    }

    // 返回首页（双击触发）
    function goHome() {
      state.currentView = 'home';
      state.currentQ = 0;
      state.questions = [];
      saveState();
      renderAll();
    }

    function showView(id) {
      state.currentView = id;
      if (id === 'review') loadReview();
      saveState();
      renderAll();
    }

    function renderAll() {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(state.currentView).classList.add('active');
      
      // 控制返回首页按钮显示
      document.getElementById('backHomeBtn').style.display = 
        state.currentView === 'home' ? 'none' : 'block';
      
      if (state.currentView === 'quiz' && state.questions.length) renderQuestion();
    }

    function renderQuestion() {
      const q = state.questions[state.currentQ];
      let html = `<h3>Q${state.currentQ+1}: ${q.title}</h3><br/>`;
      if (q.type === 'mcq') q.options.forEach(o => html+=`<label class="option-label"><input type="radio" name="qa" value="${o}" ${q.userAnswer===o?'checked':''}> ${o}</label>`);
      else if (q.type === 'tf') html+=`<label class="option-label"><input type="radio" name="qa" value="True" ${q.userAnswer==='True'?'checked':''}> True</label><label class="option-label"><input type="radio" name="qa" value="False" ${q.userAnswer==='False'?'checked':''}> False</label>`;
      else if (q.type === 'fill') html+=`<input type="text" class="fill-input" value="${q.userAnswer||''}"/>`;
      
      document.getElementById('question-container').innerHTML = html;
      document.getElementById('q-index').innerText = `Question ${state.currentQ+1}/10`;
      document.getElementById('next-btn').style.display = state.currentQ < 9 ? 'inline-block' : 'none';
      document.getElementById('submit-btn').style.display = state.currentQ === 9 ? 'inline-block' : 'none';
    }

    function saveAnswer() {
      const q = state.questions[state.currentQ];
      if (q.type === 'mcq' || q.type === 'tf') {
        const sel = document.querySelector('input[name="qa"]:checked');
        q.userAnswer = sel ? sel.value : null;
      } else if (q.type === 'fill') {
        q.userAnswer = document.querySelector('.fill-input').value.trim() || null;
      }
      saveState();
    }

    function prevQuestion(){saveAnswer();if(state.currentQ>0){state.currentQ--;saveState();renderQuestion();}}
    function nextQuestion(){saveAnswer();if(state.currentQ<9){state.currentQ++;saveState();renderQuestion();}}

    // ==============================================
    // 【彻底修复】提交试卷跳转成绩页BUG
    // ==============================================
    function submitPaper() {
      saveAnswer();
      const empty = state.questions.findIndex(q=>!q.userAnswer);
      const msg = empty === -1 ? 'Confirm submit?' : `Question ${empty+1} incomplete, submit anyway?`;

      showModal(msg, true);
      window.submitCallback = function(ok) {
        closeModal();
        if (!ok) return;

        let score = 0, total = 0, wrongs = [];
        state.questions.forEach((q, i) => {
          total += q.point;
          if (q.userAnswer === q.answer) score += q.point;
          else wrongs.push(i + 1);
        });

        testRecords.unshift({
          time: new Date().toLocaleString(),
          score: `${score}/${total}`,
          questions: JSON.parse(JSON.stringify(state.questions))
        });
        localStorage.setItem('testRecords', JSON.stringify(testRecords));

        document.getElementById('final-score').innerText = `Score: ${score}/${total}`;
        const wl = document.getElementById('wrong-list');
        wl.innerHTML = '<h4>Wrong Questions:</h4>';
        wrongs.forEach(n => wl.innerHTML += `<span class="wrong-num" onclick="showAnalysis(${n-1})">${n}</span>`);

        showView('score');
      };
    }

    function showAnalysis(idx) {
      const q = state.questions[idx] || testRecords[0].questions[idx];
      document.getElementById('analysis-content').innerHTML = `
        <h3>Q${idx+1}</h3><p>${q.title}</p><br>
        <p>Your: ${q.userAnswer || 'No answer'}</p>
        <p>Correct: ${q.answer}</p>
        <p>Analysis: ${q.analysis}</p>
      `;
      document.getElementById('analysis-modal').style.display = 'flex';
    }

    function loadReview() {
      const list = document.getElementById('review-list');
      list.innerHTML = '';
      testRecords.forEach((rec, i) => {
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
          <div class="review-header">
            <span>Test ${i+1}</span><span>Score: ${rec.score}</span>
            <button onclick="toggleReview(this)">▼</button>
          </div>
          <div class="review-body">
            ${rec.questions.map((q,j)=>`<div class="q-item ${q.userAnswer===q.answer?'correct':'wrong'}" onclick="showAnalysis(${j})">Q${j+1}: ${q.userAnswer===q.answer?'Correct':'Wrong'}</div>`).join('')}
          </div>
        `;
        list.appendChild(item);
      });
    }

    function confirmSetting() {
      const diff = document.querySelector('input[name="diff"]:checked');
      const types = Array.from(document.querySelectorAll('input[name="type"]:checked')).map(t=>t.value);
      let ok = true;
      document.querySelectorAll('.setting-group').forEach(g=>g.classList.remove('highlight'));
      if (!diff) { document.getElementById('diff-group').classList.add('highlight'); ok = false; }
      if (types.length === 0) { document.getElementById('type-group').classList.add('highlight'); ok = false; }
      if (!ok) { showModal('Test settings incomplete'); return; }
      generateQuestions(types);
      state.currentQ = 0;
      saveState();
      showView('quiz');
    }

    function showModal(text, confirmMode) {
      const m = document.getElementById('modal');
      const t = document.getElementById('modal-text');
      t.innerHTML = confirmMode ? `
        <p>${text}</p>
        <div class="modal-btns">
          <button onclick="submitCallback(true)">Yes</button>
          <button onclick="submitCallback(false)">No</button>
        </div>
      ` : `<p>${text}</p>`;
      m.style.display = 'flex';
      if (!confirmMode) m.onclick = e => e.target === m && closeModal();
    }

    function toggleReview(el) { el.parentElement.nextElementSibling.classList.toggle('show'); }
    function backFromSetting() { showModal('Confirm back?', true); }
    function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    // 启动
    window.onload = () => { renderAll(); };
  </script>
</body>
</html>
